name: Package plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read plugin version
        id: metadata
        shell: bash
        run: |
          version="$(sed -n "s/.*version '\([^']*\)'.*/\1/p" init.rb | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare installable directory
        shell: bash
        run: |
          package_root="$RUNNER_TEMP/redmine_issue_tags-package"
          mkdir -p "$package_root/redmine_issue_tags"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            ./ "$package_root/redmine_issue_tags/"

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: redmine_issue_tags-${{ steps.metadata.outputs.version }}
          path: ${{ runner.temp }}/redmine_issue_tags-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Build release archive
        id: archive
        shell: bash
        run: |
          version="${{ steps.metadata.outputs.version }}"
          archive="$RUNNER_TEMP/redmine_issue_tags-$version.zip"
          cd "$RUNNER_TEMP/redmine_issue_tags-package"
          zip -rq "$archive" redmine_issue_tags
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${{ steps.metadata.outputs.version }}"
          tag="v$version"
          archive="${{ steps.archive.outputs.path }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its published package."
          else
            gh release create "$tag" "$archive" \
              --target "$GITHUB_SHA" \
              --title "Redmine Issue Tags $version" \
              --notes "Pacote instalável do Redmine Issue Tags $version."
          fi
